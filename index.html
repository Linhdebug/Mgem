<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa con Prefabs</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
}

#mapa {
    white-space: pre;
    margin-top: 20px;
    background: black;
    padding: 15px;
    border: 2px solid white;
}
</style>
</head>
<body>

<button onclick="generar()">Generar</button>
<div id="mapa"></div>

<script>

// 🔹 PREFABS (usa el tuyo aquí)
const prefabs = [
{
data: [
"|   N    |",
"|        |",
"|   S    |"
],
connectors: {
    N: { x: 4, y: 0 },
    S: { x: 4, y: 2 }
}
}
];

// 🔹 MAPA
const W = 60;
const H = 25;

// 🔹 seed
function seedFromText(t){
    let s = 0;
    for(let i=0;i<t.length;i++) s += t.charCodeAt(i)*(i+1);
    return s;
}

function random(seed){
    let x = Math.sin(seed)*10000;
    return x - Math.floor(x);
}

function generar(){

    let seed = seedFromText("test");

    function rand(n){
        seed++;
        return Math.floor(random(seed)*n);
    }

    let map = Array.from({length:H},()=>Array(W).fill(" "));

    function canPlace(x,y,p){
        for(let i=0;i<p.data.length;i++){
            for(let j=0;j<p.data[i].length;j++){
                let char = p.data[i][j];
                if(char !== " "){
                    let mx = x + j;
                    let my = y + i;

                    if(mx < 0 || my < 0 || mx >= W || my >= H) return false;

                    if(map[my][mx] !== " ") return false;
                }
            }
        }
        return true;
    }

    function place(x,y,p){
        for(let i=0;i<p.data.length;i++){
            for(let j=0;j<p.data[i].length;j++){
                let char = p.data[i][j];
                if(char !== " "){
                    map[y+i][x+j] = char;
                }
            }
        }
    }

    // 🔹 colocar primera pieza
    let first = prefabs[0];
    let x = 20;
    let y = 10;

    place(x,y,first);

    // 🔹 añadir otra pieza conectada
    let second = prefabs[0];

    let conn1 = first.connectors.N;
    let conn2 = second.connectors.S;

    let nx = x + conn1.x - conn2.x;
    let ny = y + conn1.y - conn2.y;

    if(canPlace(nx,ny,second)){
        place(nx,ny,second);
    }

    document.getElementById("mapa").textContent =
        map.map(r=>r.join("")).join("\n");
}

</script>

</body>
</html>
